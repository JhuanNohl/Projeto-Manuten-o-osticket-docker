<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Defesa extra: bloqueia acesso web direto ao include/ (o osTicket já traz
    # um .htaccess negando, mas reforçamos aqui).
    <DirectoryMatch "^/var/www/html/include/">
        Require all denied
    </DirectoryMatch>

    # ZK-SEC: cabeçalhos de segurança padrão (mod_headers já habilitado no
    # Dockerfile). HSTS só é enviado quando a requisição chegou como HTTPS
    # de fato (direto ou via X-Forwarded-Proto de um proxy/CDN na frente,
    # ex.: Cloudflare) — nunca em HTTP puro, senão o dev local quebra.
    SetEnvIf X-Forwarded-Proto https zk_https=1
    SetEnvIf HTTPS on zk_https=1
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" env=zk_https

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
