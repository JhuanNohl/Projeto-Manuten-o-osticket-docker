; Ajustes recomendados para o osTicket (ZKTeco Manutenção)
date.timezone = America/Sao_Paulo

memory_limit = 256M
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 120
max_input_vars = 5000
expose_php = Off

; Sessões
session.cookie_httponly = 1

; OPcache (desempenho)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; DEV: revalida a cada request (0) para que edições em .php reflitam sem
; reiniciar o container. Em PRODUÇÃO troque para 2 (ou mais) por desempenho.
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
