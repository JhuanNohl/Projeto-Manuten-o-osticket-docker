# ============================================================================
#  Override de PRODUÇÃO — publica o helpdesk através do Traefik compartilhado
#  do servidor (proxy reverso único do host, ocupa sozinho as portas 80/443
#  e cuida de HTTPS/Let's Encrypt automaticamente). Ver
#  traefik-onboarding-devs.md para o guia geral de qualquer app no servidor.
#
#  Uso:
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#  O container "app" não publica NENHUMA porta no host — quem recebe o
#  tráfego externo é o Traefik, que encaminha para "app" pela rede Docker
#  "traefik-public" usando as labels abaixo (sem elas, o Traefik ignora o
#  container).
# ============================================================================

services:
  app:
    # Remove a publicação "${APP_PORT}:80" da base (docker-compose.yml) — em
    # produção o acesso é só via Traefik, não direto no host.
    ports: !override []
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.centralmanutencao.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.centralmanutencao.entrypoints=websecure"
      - "traefik.http.routers.centralmanutencao.tls.certresolver=le"
      - "traefik.http.routers.centralmanutencao.middlewares=rate-limit@file"
      - "traefik.http.services.centralmanutencao.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
